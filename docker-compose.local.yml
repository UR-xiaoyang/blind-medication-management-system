services:
  backend:
    build: ./blind-medication-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    environment:
      - CONFIG_PATH=/app/config/config.docker.yaml
      - GIN_MODE=${GIN_MODE:-release}
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env}
    networks:
      - internal

  frontend:
    build: ./blind-medication-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    networks:
      - internal

networks:
  internal:
