name: volunteer_app
description: 志愿者管理系统 - 包含任务管理、实时定位、团队协作、警告系统和数据统计
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.4.0

  # 路由
  go_router: ^12.0.0

  # 音频播放
  just_audio: ^0.9.35

  # 震动控制
  vibration: ^1.8.4

  # 本地通知
  flutter_local_notifications: ^16.0.0

  # 推送通知
  firebase_messaging: ^14.0.0

  # 网络请求
  dio: ^5.3.0

  # 本地存储
  hive_flutter: ^1.1.0

  # 地图
  google_maps_flutter: ^2.5.0

  # 图表
  fl_chart: ^0.65.0

  # 权限管理
  permission_handler: ^11.0.0

  # 工具
  intl: ^0.18.0
  uuid: ^4.0.0
  json_annotation: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.6.0
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/images/

  # 字体配置（可选）
  # fonts:
  #   - family: Roboto
  #     fonts:
  #       - asset: assets/fonts/Roboto-Regular.ttf
